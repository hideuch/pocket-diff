name: Setup pnpm
description: Set up pnpm and Node.js, restore the pnpm cache, and install dependencies.

inputs:
  node-version:
    description: Node.js version from mise.toml
    required: false
    default: 24.15.0
  pnpm-version:
    description: pnpm version from mise.toml
    required: false
    default: 11.20.0

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
