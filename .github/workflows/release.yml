name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/pocket-diff/go.mod
          cache: false

      - name: Build embedded UI
        run: |
          pnpm --filter @pocket-diff/web build
          pnpm --filter @pocket-diff/server embed

      - name: Test
        run: |
          pnpm format:check
          pnpm lint
          pnpm licenses:check
          pnpm typecheck
          pnpm test

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="pocket-diff_${os}_${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go -C apps/pocket-diff build -tags release -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$GITHUB_WORKSPACE/$name/pocket-diff" ./cmd/pocket-diff
            cp LICENSE NOTICE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.txt "$name/"
            tar -czf "release/${name}.tar.gz" "$name"
            rm -rf "$name"
          done
          name="pocket-diff_windows_amd64"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go -C apps/pocket-diff build -tags release -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$GITHUB_WORKSPACE/$name/pocket-diff.exe" ./cmd/pocket-diff
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.txt "$name/"
          zip -q -r "release/${name}.zip" "$name"
          rm -rf "$name"
          cd release
          sha256sum * > checksums.txt

      - name: Attest release archives
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release/checksums.txt

      - name: Add Sigstore bundle to release
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" release/attestation.sigstore.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --draft=false
