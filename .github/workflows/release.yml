name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/pocket-diff/go.mod
          cache: false

      - name: Build embedded UI
        run: |
          pnpm --filter @pocket-diff/web build
          pnpm --filter @pocket-diff/server embed

      - name: Test
        run: |
          pnpm typecheck
          pnpm test

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="pocket-diff_${os}_${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go -C apps/pocket-diff build -tags release -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$GITHUB_WORKSPACE/$name/pocket-diff" ./cmd/pocket-diff
            tar -czf "release/${name}.tar.gz" "$name/pocket-diff"
            rm -rf "$name"
          done
          name="pocket-diff_windows_amd64"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go -C apps/pocket-diff build -tags release -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$GITHUB_WORKSPACE/$name/pocket-diff.exe" ./cmd/pocket-diff
          zip -q -r "release/${name}.zip" "$name/pocket-diff.exe"
          rm -rf "$name"
          cd release
          sha256sum * > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
