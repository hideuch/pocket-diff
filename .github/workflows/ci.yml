name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/pocket-diff/go.mod
          cache: false

      - name: Build embedded UI
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
